<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:IB;src:url(InterDisplay-Bold.otf)} @font-face{font-family:IS;src:url(InterDisplay-SemiBold.otf)}
@font-face{font-family:IM;src:url(Inter-Medium.otf)} @font-face{font-family:MB;src:url(DejaVuSansMono-Bold.ttf)}
html,body{margin:0;background:#070708}
</style></head><body><canvas id=c></canvas><script>
const SW=2120,SH=760;
const c=document.getElementById('c');c.width=SW*2;c.height=SH*2;c.style.width=SW+'px';c.style.height=SH+'px';
const g=c.getContext('2d');g.scale(2,2);
</script><script src="fp.js"></script><script>
const A0=PI*0.75,ASP=PI*1.5;
const COL=['#ff5a5a','#ffa040','#ffe45a','#57ff9e','#57c8ff','#b46bff'];
const DISPLAY=[130,28,670,272],PRISM=[66,160,82],BAY=[14,40,104,214],METERS=[[836,40,16,204],[860,40,16,204]];
const BANDKEYS=[0,1,2,3,4,5].map(i=>[130+i*84,320,72,28]).concat([[634,320,46,28]]);
const TW=[54,72,72,46,58,46],TYPEKEYS=[];let _tx=130;TW.forEach(w=>{TYPEKEYS.push([_tx,362,w,26]);_tx+=w+12;});
const DYNKEY=[_tx,362,70,26],KNOBS=[[190,466],[310,466],[430,466],[560,466],[680,466]],KR=22,PHASEKEYS=[[836,320,92,28],[836,360,92,28]],OUTPUT=[882,466,24],LEFTKEYS=[[28,388,80,26],[28,426,80,26],[28,464,80,26]],BANDLCD=[28,326,80,50];
const ZD=-0.1; // display content sits under the glass slab
const T=(t,px,py,z,size,col,opt={})=>surfText(t,px,py,z,`${size}px IS`,col,opt);
function key(k,label,on,col,parent,size=10.5){const [x,y,w,h]=k,id=parent;layS(id,x+w/2,y+h/2,w+6,h+6);
  if(on){g.save();g.globalCompositeOperation='lighter';g.shadowColor=col;g.shadowBlur=14;g.strokeStyle=col;g.lineWidth=2.4;rr(sx(x-2),sy(y-2,0.03),(w+4)*SX,(h+4)*SY,6);g.stroke();g.restore();}
  else{g.save();g.strokeStyle=hex(col,0.25);g.lineWidth=1.4;rr(sx(x-2),sy(y-2,0.03),(w+4)*SX,(h+4)*SY,6);g.stroke();g.restore();}
  T(label,x+w/2,y+h/2,0.09,size,on?'#ffffff':'rgba(20,22,26,0.85)',{ls:0.8,parent:id,glow:on?col:null,blur:6});}
function ringKnob(px,py,r,v,col,bip=false){const cx=sx(px),cy=sy(py,0.016),rr_=r*1.24;g.save();g.lineCap='round';g.strokeStyle='rgba(255,255,255,0.06)';g.lineWidth=3;g.beginPath();g.ellipse(cx,cy,rr_*SX,rr_*SY,0,A0,A0+ASP);g.stroke();
  const a0=bip?A0+ASP/2:A0,a1=A0+ASP*v;g.globalCompositeOperation='lighter';g.shadowColor=col;g.shadowBlur=12;g.strokeStyle=col;g.lineWidth=3.2;g.beginPath();g.ellipse(cx,cy,rr_*SX,rr_*SY,0,Math.min(a0,a1),Math.max(a0,a1)+0.001);g.stroke();g.restore();
  const tx=sx(px),ty=sy(py,0.195),a=A0+ASP*v;g.save();g.lineCap='round';g.strokeStyle='rgba(20,22,26,0.9)';g.lineWidth=2.4;g.beginPath();g.moveTo(tx+Math.cos(a)*r*0.2*SX,ty+Math.sin(a)*r*0.2*SY);g.lineTo(tx+Math.cos(a)*r*0.72*SX,ty+Math.sin(a)*r*0.72*SY);g.stroke();g.restore();}
const FX=(f)=>DISPLAY[0]+Math.log10(f/20)/3*DISPLAY[2];
function bandResp(f,b){const r=Math.log2(f/b.f);if(b.t==='bell')return b.g*Math.exp(-(r*r)*b.q*2.2);if(b.t==='ls')return b.g/(1+Math.exp(r*4.5));if(b.t==='hs')return b.g/(1+Math.exp(-r*4.5));if(b.t==='hp')return r<0?Math.max(-60,r*24):0;if(b.t==='lp')return r>0?Math.max(-60,-r*12):0;return 0;}

function prism(X,Y,img,st){
  const o=win(X,Y,1000,600,'KICK IN',1,COL[st.sel],'PRISM');BX=o.x;BY=o.y;
  g.save();rr(BX,BY,FW,FH,6);g.clip();g.drawImage(img.plate,BX,BY,FW,FH);
  layS('display',DISPLAY[0]+DISPLAY[2]/2,DISPLAY[1]+DISPLAY[3]/2,DISPLAY[2]+14,DISPLAY[3]+14);layS('bay',BAY[0]+BAY[2]/2,BAY[1]+BAY[3]/2,BAY[2],BAY[3]);
  METERS.forEach(([x,y,w,h],i)=>layS('meter'+i,x+w/2,y+h/2,w,h));KNOBS.forEach(([x,y],i)=>layC('knob'+i,x,y,KR*1.42));layC('output knob',OUTPUT[0],OUTPUT[1],OUTPUT[2]*1.42);
  const bands=st.bands,sel=st.sel,sc=COL[sel],[dx,dy,dw,dh]=DISPLAY,mid=dy+dh*0.46,gY=d=>mid-d/24*(dh*0.42);
  const tot=f=>bands.reduce((s,b)=>s+bandResp(f,b),0);
  // ---- display
  g.save();rr(sx(dx),sy(dy,ZD),dw*SX,dh*SY,8);g.clip();g.fillStyle='rgba(2,3,6,0.82)';g.fillRect(sx(dx),sy(dy,ZD),dw*SX,dh*SY);
  [30,50,100,200,500,1000,2000,5000,10000].forEach(f=>{const x=FX(f);g.fillStyle='rgba(150,180,220,0.07)';g.fillRect(sx(x),sy(dy,ZD),1,dh*SY);T(f>=1000?(f/1000)+'k':f+'',x,dy+dh-12,ZD,9,'rgba(170,190,220,0.45)',{nolay:true});});
  [-18,-12,-6,0,6,12,18].forEach(d=>{const y=gY(d);g.fillStyle=d===0?'rgba(200,220,255,0.16)':'rgba(150,180,220,0.05)';g.fillRect(sx(dx),sy(y,ZD),dw*SX,1);if(d)T((d>0?'+':'')+d,dx+dw-16,y-7,ZD,9,'rgba(170,190,220,0.4)',{nolay:true});});
  // the light: each band's beam crosses the display from the prism to its node
  bands.forEach((b,k)=>{const nx=FX(b.f),ny=b.t==='hp'||b.t==='lp'?gY(-3):gY(b.g||0);g.save();g.globalCompositeOperation='lighter';const lg=g.createLinearGradient(sx(dx),0,sx(nx),0);lg.addColorStop(0,hex(COL[k],0.0));lg.addColorStop(1,hex(COL[k],k===sel?0.35:0.16));
    g.strokeStyle=lg;g.lineWidth=k===sel?7:4;g.filter='blur(3px)';g.beginPath();g.moveTo(sx(dx),sy(dy+40+k*14,ZD));g.lineTo(sx(nx),sy(ny,ZD));g.stroke();g.filter='none';g.restore();});
  // spectrum
  let q=5;const rn=()=>{q=(q*16807)%2147483647;return q/2147483647;};const spec=f=>{const l=Math.log10(f);return -18-22*Math.pow(Math.abs(l-1.85),1.6)+9*Math.exp(-Math.pow(Math.log2(f/3800),2)*2)+(rn()-0.5)*3;};
  const spY=d=>dy+dh-14-(d+60)/62*(dh-24);g.beginPath();g.moveTo(sx(dx),sy(dy+dh,ZD));for(let i=0;i<=dw;i+=2){const f=20*Math.pow(1000,i/dw);g.lineTo(sx(dx+i),sy(spY(spec(f)+tot(f)*0.9),ZD));}g.lineTo(sx(dx+dw),sy(dy+dh,ZD));g.closePath();
  const pf=g.createLinearGradient(0,sy(dy,ZD),0,sy(dy+dh,ZD));pf.addColorStop(0,'rgba(220,230,255,0.22)');pf.addColorStop(1,'rgba(220,230,255,0.02)');g.fillStyle=pf;g.fill();
  // band fills as coloured light
  bands.forEach((b,k)=>{if(b.t==='hp'||b.t==='lp')return;g.save();g.globalCompositeOperation='lighter';g.beginPath();g.moveTo(sx(dx),sy(gY(0),ZD));for(let i=0;i<=dw;i+=2){const f=20*Math.pow(1000,i/dw);g.lineTo(sx(dx+i),sy(gY(bandResp(f,b)),ZD));}g.lineTo(sx(dx+dw),sy(gY(0),ZD));g.closePath();g.fillStyle=hex(COL[k],k===sel?0.3:0.16);g.fill();g.restore();});
  // the curve: white light
  g.save();g.shadowColor='#ffffff';g.shadowBlur=16;g.strokeStyle='#f4f8ff';g.lineWidth=2.4;g.beginPath();for(let i=0;i<=dw;i++){const f=20*Math.pow(1000,i/dw);const y=Math.min(dy+dh+4,gY(tot(f)));i?g.lineTo(sx(dx+i),sy(y,ZD)):g.moveTo(sx(dx+i),sy(y,ZD));}g.stroke();g.restore();
  bands.forEach((b,k)=>{const x=FX(b.f),y=b.t==='hp'||b.t==='lp'?gY(-3):gY(b.g||0);g.save();g.globalCompositeOperation='lighter';const og=g.createRadialGradient(sx(x),sy(y,ZD),0,sx(x),sy(y,ZD),k===sel?26:16);og.addColorStop(0,hex(COL[k],0.9));og.addColorStop(1,hex(COL[k],0));g.fillStyle=og;g.fillRect(sx(x)-30,sy(y,ZD)-30,60,60);g.restore();
    g.fillStyle='#fff';g.beginPath();g.arc(sx(x),sy(y,ZD),k===sel?5:3.6,0,2*PI);g.fill();});
  {const b=bands[sel],x=FX(b.f),y=gY(b.g);screen(sx(x+18),sy(y-34,ZD),112*SX,22*SY,5,'rgba(4,6,10,0.92)');T(`${b.f>=1000?(b.f/1000).toFixed(2)+' kHz':b.f+' Hz'}  ${b.g>0?'+':''}${b.g.toFixed(1)} dB`,x+74,y-23,ZD,10,sc,{glow:sc,blur:6,nolay:true});}
  {const sh=g.createLinearGradient(sx(dx),sy(dy),sx(dx+dw*0.5),sy(dy+dh));sh.addColorStop(0,'rgba(255,255,255,0.07)');sh.addColorStop(0.35,'rgba(255,255,255,0.015)');sh.addColorStop(0.36,'rgba(255,255,255,0)');g.fillStyle=sh;g.fillRect(sx(dx),sy(dy,ZD),dw*SX,dh*SY);}
  g.restore();
  // ---- the beam: white in from the left edge, through the prism, out as the spectrum
  {const [px,py,side]=PRISM,h=side*Math.sqrt(3)/2,inY=py-h/6,lx=px-side/4,rx=px+side/4;
   g.save();g.globalCompositeOperation='lighter';
   const wb=(x0,y0,x1,y1,col,w,a)=>{g.strokeStyle=hex(col,a);g.lineWidth=w;g.beginPath();g.moveTo(sx(x0),sy(y0,0.25));g.lineTo(sx(x1),sy(y1,0.25));g.stroke();};
   g.filter='blur(4px)';wb(-10,inY+6,lx,inY,'#ffffff',8,0.5);g.filter='none';wb(-10,inY+6,lx,inY,'#ffffff',2,0.95);
   const ig=g.createRadialGradient(sx(px),sy(inY,0.25),2,sx(px),sy(inY,0.25),30);ig.addColorStop(0,'rgba(255,255,255,0.55)');ig.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=ig;g.fillRect(sx(px-40),sy(inY-40),80,80);
   COL.forEach((cl,k)=>{const y1=dy+40+k*14;g.filter='blur(3px)';wb(rx,inY+k*1.2,dx+2,y1,cl,6,0.5);g.filter='none';wb(rx,inY+k*1.2,dx+2,y1,cl,1.6,0.95);});
   g.restore();}
  surfText('PRISM',66,22,0,'15px IB','#ffffff',{ls:5,glow:'#9fb8ff',blur:8});
  // ---- meters
  METERS.forEach(([x,y,w,h],i)=>{const lv=i?0.7:0.76,zz=-0.06;const lg=g.createLinearGradient(0,sy(y+h,zz),0,sy(y,zz));COL.forEach((cl,k)=>lg.addColorStop(k/5,cl));g.save();g.shadowColor='#fff';g.shadowBlur=8;g.fillStyle=lg;g.fillRect(sx(x+3),sy(y+h*(1-lv),zz),(w-6)*SX,h*lv*SY);g.restore();});
  T('OUT',856,258,0,10,'rgba(225,230,240,0.75)',{ls:2});nixie(856,278,'-3.1 dB',62,'#ffffff','#9fb8ff','#05070a');
  // ---- keys
  bands.forEach((b,k)=>key(BANDKEYS[k],`${k+1}   ${b.f>=1000?(b.f/1000)+'k':b.f}`,k===sel,COL[k],'band'+k));key(BANDKEYS[6],'+',false,'#ffffff','addband',14);
  ['BELL','LO SHELF','HI SHELF','CUT','NOTCH','TILT'].forEach((t,i)=>key(TYPEKEYS[i],t,i===st.type,sc,'type'+i,9.5));key(DYNKEY,'DYNAMIC',st.dyn,sc,'dyn',9.5);
  ['NATURAL','LINEAR'].forEach((t,i)=>key(PHASEKEYS[i],t,i===st.phase,'#ffffff','phase'+i,10));
  T('PHASE',882,304,0,10,'rgba(225,230,240,0.75)',{ls:2});
  ['ON','SOLO','DELETE'].forEach((t,i)=>key(LEFTKEYS[i],t,i===0,sc,'left'+i,10));
  // band LCD
  {const [x,y,w,h]=BANDLCD,zz=-0.05;layS('bandlcd',x+w/2,y+h/2,w,h);surfText('BAND',x+w/2,y+11,zz,'8.5px IS','rgba(220,225,235,0.6)',{ls:1.5,parent:'bandlcd'});surfText(String(sel+1),x+w/2,y+32,zz,'24px IB',sc,{glow:sc,blur:12,parent:'bandlcd'});}
  // knobs
  const b=bands[sel];
  [['FREQ',Math.log10(b.f/20)/3,b.f>=1000?`${(b.f/1000).toFixed(2)} kHz`:`${b.f} Hz`],['GAIN',(b.g+24)/48,`${b.g>0?'+':''}${b.g.toFixed(1)} dB`,true],['Q',0.4,'1.30'],['DYN THRESH',st.dyn?0.45:0,st.dyn?'-28 dB':'off'],['DYN RANGE',st.dyn?0.38:0.5,st.dyn?'-6.0 dB':'0.0 dB',true]].forEach(([l,v,t,bip],i)=>{
    const [px,py]=KNOBS[i];ringKnob(px,py,KR,v,sc,bip);T(l,px,py-46,0,10,'rgba(225,230,240,0.8)',{ls:1.6});nixie(px,py+46,t,82,sc,sc,'#05070a');});
  ringKnob(OUTPUT[0],OUTPUT[1],OUTPUT[2],0.5,'#ffffff',true);T('OUTPUT',OUTPUT[0],OUTPUT[1]-48,0,10,'rgba(225,230,240,0.8)',{ls:1.6});nixie(OUTPUT[0],OUTPUT[1]+50,'0.0 dB',72,'#ffffff','#9fb8ff','#05070a');
  checkLayout('prism');g.restore();
}

(async()=>{
  for(const f of ['12px IB','12px IS','12px IM','12px MB'])await document.fonts.load(f);
  const img={plate:await L('prism/prism.png')};
  const bg=g.createRadialGradient(SW/2,SH*0.4,100,SW/2,SH/2,SW*0.7);bg.addColorStop(0,'#1c1b1f');bg.addColorStop(1,'#060607');g.fillStyle=bg;g.fillRect(0,0,SW,SH);
  uiText('EQ  →  PRISM',SW/2,34,'15px IB','rgba(240,240,245,0.92)',3);
  uiText('White light goes into the prism and comes out as the bands: each band is one colour of the spectrum, from its beam to its glow on the curve, its key and its knob rings.',SW/2,58,'12px IM','rgba(220,220,230,0.5)');
  const bands=[{t:'hp',f:28,c:0},{t:'bell',f:62,g:5,q:1.2},{t:'bell',f:320,g:-7,q:1.6},{t:'bell',f:3800,g:6,q:1.3},{t:'hs',f:9000,g:3},{t:'lp',f:16000}];
  prism(40,100,img,{bands,sel:3,type:0,dyn:false,phase:0});
  const b2=bands.map(b=>({...b}));b2[1].g=8;
  prism(1080,100,img,{bands:b2,sel:1,type:0,dyn:true,phase:0});
  document.title='done';
})();
</script></body></html>
