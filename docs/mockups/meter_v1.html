@font-face{font-family:IB;src:url(InterDisplay-Bold.otf)} @font-face{font-family:IS;src:url(InterDisplay-SemiBold.otf)}
@font-face{font-family:IM;src:url(Inter-Medium.otf)} @font-face{font-family:MB;src:url(DejaVuSansMono-Bold.ttf)}

</style></head><body><canvas id=c width=1960 height=2340 style="width:980px;height:1170px"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');g.scale(2,2);
const L=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s});
function txt(t,x,y,f,col,al='center'){g.font=f;g.fillStyle=col;g.textAlign=al;g.textBaseline='middle';g.fillText(t,x,y);}
function hex(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;}
function mixc(h,w,t){const a=parseInt(h.slice(1),16),b=parseInt(w.slice(1),16);const r=Math.round(((a>>16)*(1-t)+(b>>16)*t)),gg=Math.round((((a>>8)&255)*(1-t)+((b>>8)&255)*t)),bb=Math.round(((a&255)*(1-t)+(b&255)*t));return `rgb(${r},${gg},${bb})`;}
function arc(cx,cy,r,v,col,bip,w){const a0=Math.PI*0.75,a1=Math.PI*2.25;g.lineCap='round';g.strokeStyle='rgba(255,255,255,0.08)';g.lineWidth=w;g.beginPath();g.arc(cx,cy,r,a0,a1);g.stroke();
 const s=bip?Math.PI*1.5:a0,e=bip?Math.PI*1.5+(v-0.5)*1.5*Math.PI:a0+v*1.5*Math.PI;g.save();g.shadowColor=col;g.shadowBlur=10;g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.arc(cx,cy,r,Math.min(s,e),Math.max(s,e));g.stroke();g.restore();}
const dbF=db=>{const m=[[6,0],[0,0.12],[-6,0.27],[-12,0.42],[-24,0.62],[-40,0.8],[-60,0.97]];for(let i=0;i<m.length-1;i++)if(db<=m[i][0]&&db>=m[i+1][0]){const u=(m[i][0]-db)/(m[i][0]-m[i+1][0]);return m[i][1]+u*(m[i+1][1]-m[i][1]);}return 1;};
// the liquid tube: glass drawn over glowing liquid
function tube(x,y,w,h,lev,peak,col,flash,seed){
 const r=w/2;
 const clip=()=>{g.beginPath();g.roundRect(x,y,w,h,r);};
 // the empty glass: deep tinted interior
 g.save();clip();g.clip();
 const gi=g.createLinearGradient(x,0,x+w,0);gi.addColorStop(0,'rgba(10,12,16,0.95)');gi.addColorStop(0.5,'rgba(22,26,34,0.9)');gi.addColorStop(1,'rgba(8,9,12,0.95)');g.fillStyle=gi;g.fillRect(x,y,w,h);
 // faint scale inside the glass
 for(const d of [0,-6,-12,-24,-40]){const yy=y+dbF(d)*h;g.fillStyle='rgba(255,255,255,0.10)';g.fillRect(x+2,yy,w*0.3,1);}
 // the liquid
 const top=y+h*(1-lev), t=seed;
 const lg=g.createLinearGradient(0,y+h,0,top);lg.addColorStop(0,mixc(col,'#000000',0.55));lg.addColorStop(0.55,col);lg.addColorStop(1,mixc(col,'#ffffff',0.45));
 g.fillStyle=lg;g.beginPath();g.moveTo(x,y+h);
 for(let i=0;i<=24;i++){const xx=x+i/24*w;const wob=Math.sin(i/24*Math.PI*2+t)*1.6+Math.sin(i/24*Math.PI*5+t*2)*0.7;g.lineTo(xx,top+wob-(Math.sin(i/24*Math.PI))*2.2);}
 g.lineTo(x+w,y+h);g.closePath();g.fill();
 // a curved highlight band through the liquid (the cylinder's shading)
 const sh=g.createLinearGradient(x,0,x+w,0);sh.addColorStop(0,'rgba(0,0,0,0.45)');sh.addColorStop(0.28,'rgba(255,255,255,0.0)');sh.addColorStop(0.42,'rgba(255,255,255,0.22)');sh.addColorStop(0.6,'rgba(255,255,255,0)');sh.addColorStop(1,'rgba(0,0,0,0.5)');
 g.fillStyle=sh;g.fillRect(x,top-4,w,y+h-top+4);
 // the meniscus: a bright skin
 g.strokeStyle=mixc(col,'#ffffff',0.7);g.lineWidth=1.4;g.beginPath();for(let i=0;i<=24;i++){const xx=x+i/24*w;const wob=Math.sin(i/24*Math.PI*2+t)*1.6+Math.sin(i/24*Math.PI*5+t*2)*0.7;const yy=top+wob-(Math.sin(i/24*Math.PI))*2.2;i?g.lineTo(xx,yy):g.moveTo(xx,yy);}g.stroke();
 // bubbles rising
 let rs=seed*997;const rnd=()=>{rs=(rs*16807)%2147483647;return rs/2147483647;};
 for(let i=0;i<9;i++){const by=top+8+rnd()*(y+h-top-14),bx=x+3+rnd()*(w-6),br=0.8+rnd()*1.8;g.strokeStyle='rgba(255,255,255,0.55)';g.lineWidth=0.7;g.beginPath();g.arc(bx,by,br,0,Math.PI*2);g.stroke();g.fillStyle='rgba(255,255,255,0.18)';g.fill();}
 // the white-hot flash of a fresh hit, rising with the surface
 if(flash){const fg=g.createLinearGradient(0,top-2,0,top+60);fg.addColorStop(0,'rgba(255,255,255,0.95)');fg.addColorStop(0.25,'rgba(255,255,255,0.5)');fg.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=fg;g.fillRect(x,top-3,w,62);}
 g.restore();
 // bloom: the liquid lights the trough around the tube
 g.save();g.globalCompositeOperation='lighter';const bl=g.createRadialGradient(x+w/2,top+40,2,x+w/2,top+40,w*3);bl.addColorStop(0,hex(col.startsWith('#')?col:'#ffffff',0.22));bl.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=bl;g.fillRect(x-w*3,top-w*2,w*7,w*7);g.restore();
 // the glass: rim, two specular streaks, end-cap glints
 g.save();clip();g.clip();
 const s1=g.createLinearGradient(x,0,x+w,0);s1.addColorStop(0,'rgba(255,255,255,0)');s1.addColorStop(0.16,'rgba(255,255,255,0.0)');s1.addColorStop(0.22,'rgba(255,255,255,0.55)');s1.addColorStop(0.3,'rgba(255,255,255,0.05)');s1.addColorStop(0.78,'rgba(255,255,255,0)');s1.addColorStop(0.86,'rgba(255,255,255,0.16)');s1.addColorStop(0.94,'rgba(255,255,255,0)');
 g.fillStyle=s1;g.fillRect(x,y+r*0.6,w,h-r*1.2);
 const eg=g.createRadialGradient(x+w*0.38,y+r*0.75,0,x+w*0.38,y+r*0.75,r*0.9);eg.addColorStop(0,'rgba(255,255,255,0.6)');eg.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=eg;g.fillRect(x,y,w,r*2);
 g.restore();
 g.strokeStyle='rgba(210,220,235,0.55)';g.lineWidth=1;g.beginPath();g.roundRect(x+0.5,y+0.5,w-1,h-1,r);g.stroke();
 g.strokeStyle='rgba(0,0,0,0.7)';g.lineWidth=1;g.beginPath();g.roundRect(x-1,y-1,w+2,h+2,r+1);g.stroke();
 // the peak bead: a glowing drop floating above the liquid, slowly sinking
 const py=y+h*(1-peak);g.save();g.shadowColor=col;g.shadowBlur=12;const pb=g.createRadialGradient(x+w/2-1,py-1,0,x+w/2,py,w*0.32);pb.addColorStop(0,'#ffffff');pb.addColorStop(0.5,mixc(col,'#ffffff',0.5));pb.addColorStop(1,col);g.fillStyle=pb;g.beginPath();g.ellipse(x+w/2,py,w*0.3,w*0.22,0,0,Math.PI*2);g.fill();g.restore();
}
(async()=>{
await document.fonts.load('10px IB');await document.fonts.load('10px IM');await document.fonts.load('10px MB');await document.fonts.load('10px IS');
const sm=await L('strip_mono.png'),ss=await L('strip_stereo.png'),cap=await L('cap_small.png');
g.fillStyle='#050608';g.fillRect(0,0,980,1170);
const K=1.55, Y0=46;
const strips=[['Top','#29d3ff',false,['EQ','COMP','SATURATE'],-1.5,[0.66],[0.74],true,0.35,0,false],
 ['Bottom','#3b8cff',false,['EQ','GATE'],-4,[0.86],[0.9],false,0.2,0,true],
 ['Overheads','#a06bff',true,['TUBE EQ','COMP'],-6,[0.58,0.52],[0.66,0.61],false,0.15,0.4,false],
 ['Master','#ffa040',true,['COMP','SATURATE','EQ'],0,[0.8,0.78],[0.88,0.86],false,0.25,0.1,false,true]];
strips.forEach((d,si)=>{
 const [name,col,stereo,ins,fdb,lev,peak,sel,r1,r2,flash,master]=d;
 const x0=24+si*(112*K+22);const P=(px,py)=>[x0+px*K,Y0+py*K];
 // colour wash in the brushed metal and the selected glow
 g.drawImage(stereo?ss:sm,x0,Y0,112*K,690*K);
 g.save();g.globalCompositeOperation='overlay';g.fillStyle=hex(col,0.20);g.beginPath();g.roundRect(x0+4*K,Y0+4*K,104*K,682*K,6);g.fill();g.restore();
 if(sel){g.save();g.strokeStyle=hex(col,0.9);g.shadowColor=col;g.shadowBlur=18;g.lineWidth=2;g.beginPath();g.roundRect(x0+2,Y0+2,112*K-4,690*K-4,8);g.stroke();g.restore();}
 // the name: a glowing LCD
 let [nx,ny]=P(8,8);g.save();const lcd=g.createLinearGradient(0,ny,0,ny+24*K);lcd.addColorStop(0,hex(col,0.18));lcd.addColorStop(1,hex(col,0.06));g.fillStyle=lcd;g.beginPath();g.roundRect(nx+2,ny+2,96*K-4,24*K-4,3);g.fill();g.restore();
 g.save();g.shadowColor=col;g.shadowBlur=10;txt(name,nx+48*K,ny+12*K,'600 15px IS',mixc(col,'#ffffff',0.55));g.restore();
 // insert slots: lit glass keys
 for(let i=0;i<5;i++){const [ix,iy]=P(8,40+i*26);const has=i<ins.length;
  if(has){g.save();g.globalCompositeOperation='lighter';const kg=g.createLinearGradient(0,iy,0,iy+22*K);kg.addColorStop(0,hex(col,0.10));kg.addColorStop(1,hex(col,0.30));g.fillStyle=kg;g.beginPath();g.roundRect(ix+4,iy+3,96*K-8,22*K-8,4);g.fill();g.restore();
   g.save();g.shadowColor=col;g.shadowBlur=8;g.fillStyle=col;g.fillRect(ix+14,iy+22*K-6,96*K-28,1.6);g.restore();}
  txt(has?ins[i]:'',ix+48*K,iy+10.5*K,'700 11px IB',has?'#f4f6fa':'#4a4f57');}
 // sends and pan
 let [ax,ay]=P(32,198);arc(ax,ay,15*K,r1,'#a78bff',false,2.6);txt('R1',ax,ay+21*K,'700 9.5px IB','#b9bec6');
 [ax,ay]=P(80,198);arc(ax,ay,15*K,r2,'#29e3ff',false,2.6);txt('R2',ax,ay+21*K,'700 9.5px IB','#b9bec6');
 [ax,ay]=P(56,250);arc(ax,ay,17.5*K,0.5,master?'#ffa040':'#ffffff',true,2.6);txt(master?'BAL':'C',ax,ay+21.5*K,'700 9px IB','#8b9099');
 let [mx,my]=P(12,276);txt('M',mx+21*K,my+10*K,'700 11px IB','#9aa0a9');[mx,my]=P(58,276);txt('S',mx+21*K,my+10*K,'700 11px IB',si==1?'#ffd166':'#9aa0a9');
 if(si==1){g.save();g.globalCompositeOperation='lighter';g.fillStyle='rgba(255,209,102,0.18)';g.beginPath();g.roundRect(mx+3,my+3,42*K-6,20*K-6,3);g.fill();g.restore();}
 // the fader: a lit groove up to the cap, the cap with a colour stripe
 const [fx,ft]=P(34,306), fh=340*K, cy=ft+dbF(fdb)*fh;
 g.save();g.shadowColor=col;g.shadowBlur=8;g.fillStyle=hex(col,0.85);g.fillRect(fx-1.2,cy,2.4,ft+fh-cy);g.restore();
 g.font='9px MB';g.textAlign='right';g.textBaseline='middle';
 for(const dd of [6,0,-6,-12,-24,-40]){const yy=ft+dbF(dd)*fh;g.fillStyle='rgba(255,255,255,0.28)';g.fillRect(x0+18*K,yy,7*K,1);g.fillStyle='#6f767f';g.fillText(dd>0?'+'+dd:''+dd,x0+17*K,yy);}
 g.drawImage(cap,fx-cap.width*0.33,cy-cap.height*0.33,cap.width*0.66,cap.height*0.66);
 g.save();g.shadowColor=col;g.shadowBlur=6;g.fillStyle=col;g.fillRect(fx-cap.width*0.28,cy-1,cap.width*0.56,2);g.restore();
 // the tube(s)
 const tubes=stereo?[[71,15],[90,15]]:[[80,20]];
 tubes.forEach(([tx,tw],k)=>{const [px,py]=P(tx,306);tube(px,py,tw*K,340*K,lev[k],peak[k],col,flash,si*3+k+1.3);});
 // readouts: the fader, the peak
 const [rx,ry]=P(14,652);txt((fdb>0?'+':'')+fdb.toFixed(1),rx+25*K,ry+11*K,'700 12px MB',master?'#ffa040':'#e8ecf2');
 const pk=stereo?Math.max(...peak):peak[0];const pdb=pk>0.88?-1.2:pk>0.8?-3.4:pk>0.7?-6.8:-10.5;
 txt((pdb).toFixed(1),x0+(stereo?89:90)*K,ry+11*K,'700 11px MB',pdb>-2?'#ff5a5f':mixc(col,'#ffffff',0.4));
});
txt('LIQUID TUBE METERS  ·  Top selected  ·  Bottom soloed, just hit (white-hot flash)  ·  Overheads and Master in stereo: two tubes',490,22,'600 12px IS','#8b9099');
document.title='done';
})();
