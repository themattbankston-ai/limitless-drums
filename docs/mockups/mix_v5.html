function hex(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;}
function mixc(h,w,t){const a=parseInt(h.slice(1),16),b=parseInt(w.slice(1),16);const r=Math.round(((a>>16)*(1-t)+(b>>16)*t)),gg=Math.round((((a>>8)&255)*(1-t)+((b>>8)&255)*t)),bb=Math.round(((a&255)*(1-t)+(b&255)*t));return `rgb(${r},${gg},${bb})`;}

const dbF=db=>{const m=[[6,0],[0,0.12],[-6,0.27],[-12,0.42],[-24,0.62],[-40,0.8],[-60,0.97]];for(let i=0;i<m.length-1;i++)if(db<=m[i][0]&&db>=m[i+1][0]){const u=(m[i][0]-db)/(m[i][0]-m[i+1][0]);return m[i][1]+u*(m[i+1][1]-m[i][1]);}return 1;};
// the liquid tube: glass drawn over glowing liquid
function tube(x,y,w,h,lev,peak,col,flash,seed){
 const r=w/2;
 const clip=()=>{g.beginPath();g.roundRect(x,y,w,h,r);};
 // the empty glass: deep tinted interior
 g.save();clip();g.clip();
 const gi=g.createLinearGradient(x,0,x+w,0);gi.addColorStop(0,'rgba(10,12,16,0.95)');gi.addColorStop(0.5,'rgba(22,26,34,0.9)');gi.addColorStop(1,'rgba(8,9,12,0.95)');g.fillStyle=gi;g.fillRect(x,y,w,h);
 // faint scale inside the glass
 for(const d of [0,-6,-12,-24,-40]){const yy=y+dbF(d)*h;g.fillStyle='rgba(255,255,255,0.10)';g.fillRect(x+2,yy,w*0.3,1);}
 // the liquid
 const top=y+h*(1-lev), t=seed;
 const lg=g.createLinearGradient(0,y+h,0,top);lg.addColorStop(0,mixc(col,'#000000',0.55));lg.addColorStop(0.55,col);lg.addColorStop(1,mixc(col,'#ffffff',0.45));
 g.fillStyle=lg;g.beginPath();g.moveTo(x,y+h);
 for(let i=0;i<=24;i++){const xx=x+i/24*w;const wob=Math.sin(i/24*Math.PI*2+t)*1.6+Math.sin(i/24*Math.PI*5+t*2)*0.7;g.lineTo(xx,top+wob-(Math.sin(i/24*Math.PI))*2.2);}
 g.lineTo(x+w,y+h);g.closePath();g.fill();
 // a curved highlight band through the liquid (the cylinder's shading)
 const sh=g.createLinearGradient(x,0,x+w,0);sh.addColorStop(0,'rgba(0,0,0,0.45)');sh.addColorStop(0.28,'rgba(255,255,255,0.0)');sh.addColorStop(0.42,'rgba(255,255,255,0.22)');sh.addColorStop(0.6,'rgba(255,255,255,0)');sh.addColorStop(1,'rgba(0,0,0,0.5)');
 g.fillStyle=sh;g.fillRect(x,top-4,w,y+h-top+4);
 // the meniscus: a bright skin
 g.strokeStyle=mixc(col,'#ffffff',0.7);g.lineWidth=1.4;g.beginPath();for(let i=0;i<=24;i++){const xx=x+i/24*w;const wob=Math.sin(i/24*Math.PI*2+t)*1.6+Math.sin(i/24*Math.PI*5+t*2)*0.7;const yy=top+wob-(Math.sin(i/24*Math.PI))*2.2;i?g.lineTo(xx,yy):g.moveTo(xx,yy);}g.stroke();
 // bubbles rising
 let rs=seed*997;const rnd=()=>{rs=(rs*16807)%2147483647;return rs/2147483647;};
 for(let i=0;i<9;i++){const by=top+8+rnd()*(y+h-top-14),bx=x+3+rnd()*(w-6),br=0.8+rnd()*1.8;g.strokeStyle='rgba(255,255,255,0.55)';g.lineWidth=0.7;g.beginPath();g.arc(bx,by,br,0,Math.PI*2);g.stroke();g.fillStyle='rgba(255,255,255,0.18)';g.fill();}
 // the white-hot flash of a fresh hit, rising with the surface
 if(flash){const fg=g.createLinearGradient(0,top-2,0,top+60);fg.addColorStop(0,'rgba(255,255,255,0.95)');fg.addColorStop(0.25,'rgba(255,255,255,0.5)');fg.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=fg;g.fillRect(x,top-3,w,62);}
 g.restore();
 // bloom: the liquid lights the trough around the tube
 g.save();g.globalCompositeOperation='lighter';const bl=g.createRadialGradient(x+w/2,top+40,2,x+w/2,top+40,w*3);bl.addColorStop(0,hex(col.startsWith('#')?col:'#ffffff',0.22));bl.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=bl;g.fillRect(x-w*3,top-w*2,w*7,w*7);g.restore();
 // the glass: rim, two specular streaks, end-cap glints
 g.save();clip();g.clip();
 const s1=g.createLinearGradient(x,0,x+w,0);s1.addColorStop(0,'rgba(255,255,255,0)');s1.addColorStop(0.16,'rgba(255,255,255,0.0)');s1.addColorStop(0.22,'rgba(255,255,255,0.55)');s1.addColorStop(0.3,'rgba(255,255,255,0.05)');s1.addColorStop(0.78,'rgba(255,255,255,0)');s1.addColorStop(0.86,'rgba(255,255,255,0.16)');s1.addColorStop(0.94,'rgba(255,255,255,0)');
 g.fillStyle=s1;g.fillRect(x,y+r*0.6,w,h-r*1.2);
 const eg=g.createRadialGradient(x+w*0.38,y+r*0.75,0,x+w*0.38,y+r*0.75,r*0.9);eg.addColorStop(0,'rgba(255,255,255,0.6)');eg.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=eg;g.fillRect(x,y,w,r*2);
 g.restore();
 g.strokeStyle='rgba(210,220,235,0.55)';g.lineWidth=1;g.beginPath();g.roundRect(x+0.5,y+0.5,w-1,h-1,r);g.stroke();
 g.strokeStyle='rgba(0,0,0,0.7)';g.lineWidth=1;g.beginPath();g.roundRect(x-1,y-1,w+2,h+2,r+1);g.stroke();
 // the peak bead: a glowing drop floating above the liquid, slowly sinking

}
