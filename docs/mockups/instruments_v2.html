<!doctype html>
<html><head><meta charset="utf-8">
<style>
body{margin:0;width:1760px;height:860px;background:radial-gradient(ellipse at 50% 0%,#14161c,#030304 70%);font-family:'Inter Display','Inter',sans-serif;color:#f2efe8;position:relative;overflow:hidden}
.cap{position:absolute;top:26px;width:318px;text-align:center;font-size:15px;font-weight:800;letter-spacing:.3em}
.cap span{display:block;font-size:11px;font-weight:500;letter-spacing:0;color:#8b9099;margin-top:6px}
canvas{position:absolute;top:92px;border-radius:12px;box-shadow:0 26px 60px rgba(0,0,0,.85),0 0 0 1px #000}
</style></head><body>
<script src="alignrows.js"></script>
<script>
const VCOL=["#4c8dff","#2ee6ff","#7cff9b","#ffd85a","#ff6a3d","#ff3da8"];
const MIC=[["Top","#2ee6ff"],["Bottom","#4c8dff"],["Overheads","#9b6bff"],["Room Mono","#c86bff"],["Room Close","#ff3da8"],["Room Far","#ff7a8a"],["Room Crush","#ff7ad9"]];
const W=318,H=720;
function panel(i,step,note,col){
  const x=20+i*344;const cv=document.createElement('canvas');cv.width=W*2;cv.height=H*2;cv.style.cssText=`left:${x}px;width:${W}px;height:${H}px`;document.body.appendChild(cv);
  const cap=document.createElement('div');cap.className='cap';cap.style.left=x+'px';cap.style.color=col;cap.innerHTML=step+'<span>'+note+'</span>';document.body.appendChild(cap);
  const c=cv.getContext('2d');c.scale(2,2);return c;
}
// helpers
function metal(c,x,y,w,h,r,top,bot,brushed=true){const g=c.createLinearGradient(0,y,0,y+h);g.addColorStop(0,top);g.addColorStop(1,bot);c.save();rr(c,x,y,w,h,r);c.fillStyle=g;c.shadowColor='rgba(0,0,0,.8)';c.shadowBlur=12;c.shadowOffsetY=5;c.fill();c.restore();
  if(brushed){c.save();rr(c,x,y,w,h,r);c.clip();c.globalAlpha=.05;for(let yy=y;yy<y+h;yy+=1.3){c.fillStyle=Math.random()<.5?'#fff':'#000';c.fillRect(x,yy,w,.6)}c.restore()}
  c.save();rr(c,x+.5,y+.5,w-1,h-1,r);c.strokeStyle='rgba(255,255,255,.14)';c.stroke();c.restore();
  const hl=c.createLinearGradient(x,y,x+w*.6,y+h*.4);hl.addColorStop(0,'rgba(255,255,255,.10)');hl.addColorStop(1,'rgba(255,255,255,0)');c.save();rr(c,x,y,w,h,r);c.fillStyle=hl;c.fill();c.restore()}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function well(c,x,y,w,h,r,bg='#030407'){c.save();rr(c,x,y,w,h,r);c.fillStyle=bg;c.fill();c.clip();const g=c.createLinearGradient(0,y,0,y+14);g.addColorStop(0,'rgba(0,0,0,.9)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(x,y,w,14);c.restore();c.save();rr(c,x+.5,y+.5,w-1,h-1,r);c.strokeStyle='rgba(255,255,255,.06)';c.stroke();c.restore();
  c.save();rr(c,x,y,w,h,r);c.clip();const s=c.createLinearGradient(x,y,x+w,y+h);s.addColorStop(0,'rgba(255,255,255,.06)');s.addColorStop(.3,'rgba(255,255,255,0)');c.fillStyle=s;c.fillRect(x,y,w,h);c.restore()}
function screw(c,x,y){const g=c.createRadialGradient(x-1.5,y-1.5,.5,x,y,5);g.addColorStop(0,'#e5e8ec');g.addColorStop(1,'#3d4148');c.fillStyle=g;c.beginPath();c.arc(x,y,4.5,0,7);c.fill();c.strokeStyle='#222';c.lineWidth=1.2;c.beginPath();c.moveTo(x-3,y-1.8);c.lineTo(x+3,y+1.8);c.stroke()}
function screws(c,x,y,w,h){screw(c,x+10,y+10);screw(c,x+w-10,y+10);screw(c,x+10,y+h-10);screw(c,x+w-10,y+h-10)}
function txt(c,s,x,y,col,f='800 9px Inter',al='left',sp=0){c.save();c.font=f;c.fillStyle=col;c.textAlign=al;if(sp)c.letterSpacing=sp+'px';c.fillText(s,x,y);c.restore()}
function glowTxt(c,s,x,y,col,f,al='left',sp=0){c.save();c.shadowColor=col;c.shadowBlur=10;txt(c,s,x,y,col,f,al,sp);c.restore()}
function knob(c,x,y,r,col,v,bi){const R=r*1.3;c.save();c.strokeStyle='#08090b';c.lineWidth=r*.42;c.beginPath();c.arc(x,y,R,.75*Math.PI,2.25*Math.PI);c.stroke();c.restore();
  const a0=-.75*Math.PI,a1=bi?v*.75*Math.PI:a0+1.5*Math.PI*v;c.save();c.strokeStyle=col;c.lineWidth=3;c.lineCap='round';c.shadowColor=col;c.shadowBlur=12;c.beginPath();c.arc(x,y,R,(bi?Math.min(0,a1):a0)-Math.PI/2,(bi?Math.max(0,a1):a1)-Math.PI/2);c.stroke();c.restore();
  c.save();c.shadowColor='rgba(0,0,0,.9)';c.shadowBlur=10;c.shadowOffsetY=5;const g=c.createLinearGradient(0,y-r,0,y+r);g.addColorStop(0,'#2a2c31');g.addColorStop(1,'#0b0c0e');c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill();c.restore();
  const cg=c.createRadialGradient(x-r*.3,y-r*.35,1,x,y,r*.8);cg.addColorStop(0,'#fbfcfd');cg.addColorStop(.6,'#a6abb3');cg.addColorStop(1,'#5a5f67');c.fillStyle=cg;c.beginPath();c.arc(x,y,r*.74,0,7);c.fill();
  c.strokeStyle='#1b1d21';c.lineWidth=2;c.lineCap='round';c.beginPath();c.moveTo(x+Math.sin(a1)*r*.2,y-Math.cos(a1)*r*.2);c.lineTo(x+Math.sin(a1)*r*.62,y-Math.cos(a1)*r*.62);c.stroke()}
function led(c,x,y,col,on){if(on){c.save();c.fillStyle=col;c.shadowColor=col;c.shadowBlur=12;c.beginPath();c.arc(x,y,3,0,7);c.fill();c.restore()}else{c.fillStyle='#24262b';c.beginPath();c.arc(x,y,3,0,7);c.fill()}}
function toggle(c,x,y,up,label){ // a bat-handle toggle switch
  well(c,x-11,y-16,22,32,11,'#0a0b0d');c.save();c.shadowColor='rgba(0,0,0,.9)';c.shadowBlur=6;c.shadowOffsetY=3;const g=c.createLinearGradient(x-4,0,x+4,0);g.addColorStop(0,'#5a5f67');g.addColorStop(.5,'#f0f2f5');g.addColorStop(1,'#5a5f67');c.fillStyle=g;rr(c,x-3.5,up?y-17:y-1,7,18,3.5);c.fill();c.restore();
  if(label)txt(c,label,x,y+30,'#b9bec6','800 8px Inter','center',1.2)}
function bloom(c,x,y,r,col,a=.35){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');c.save();c.globalAlpha=a;c.globalCompositeOperation='lighter';c.fillStyle=g;c.fillRect(x-r,y-r,2*r,2*r);c.restore()}


// more parts
function dropdown(c,x,y,w,label,value,col){txt(c,label,x,y-6,'#8b9099','800 7.5px Inter','left',1.4);well(c,x,y,w,26,6,'#08090c');c.save();rr(c,x+.5,y+.5,w-1,25,6);c.strokeStyle=col;c.globalAlpha=.55;c.stroke();c.restore();
  txt(c,value,x+10,y+17,'#f2efe8','700 11px Inter');c.save();c.fillStyle=col;c.beginPath();c.moveTo(x+w-18,y+11);c.lineTo(x+w-10,y+11);c.lineTo(x+w-14,y+16);c.fill();c.restore()}
function hwbtn(c,x,y,w,h,label,col,on,icon){c.save();c.shadowColor='rgba(0,0,0,.9)';c.shadowBlur=6;c.shadowOffsetY=3;const g=c.createLinearGradient(0,y,0,y+h);g.addColorStop(0,on?'#34363c':'#2a2c31');g.addColorStop(1,'#141518');c.fillStyle=g;rr(c,x,y,w,h,6);c.fill();c.restore();
  c.save();rr(c,x+.5,y+.5,w-1,h-1,6);c.strokeStyle=on?col:'rgba(255,255,255,.1)';c.globalAlpha=on?.8:1;c.stroke();c.restore();if(on)bloom(c,x+w/2,y+h/2,w*.6,col,.18);
  let tx=x+w/2;if(icon){icon(x+12,y+h/2);tx+=6}txt(c,label,tx,y+h/2+3.5,on?'#fff':'#b9bec6','800 8.5px Inter','center',1.1)}
const playIcon=(c,col)=>(x,y)=>{c.save();c.fillStyle=col;c.shadowColor=col;c.shadowBlur=8;c.beginPath();c.moveTo(x-3,y-5);c.lineTo(x+5,y);c.lineTo(x-3,y+5);c.fill();c.restore()};
function nudge(c,x,y,col){['◀◀','◀','▶','▶▶'].forEach((s,k)=>{hwbtn(c,x+k*34,y,30,22,s,col,false)})}

// 1 SESSION — a patch bay; Auto Prep lives here
{const c=panel(0,'SESSION','a patch bay, and the Auto Prep button','#2ee6ff');
 c.fillStyle='#050608';c.fillRect(0,0,W,H);metal(c,4,6,W-8,H-12,12,'#23262c','#0e0f12');screws(c,4,6,W-8,H-12);
 glowTxt(c,'SESSION',26,34,'#2ee6ff','800 11px Inter','left',3);txt(c,'7 MICS · 44.1 kHz',292,34,'#8b9099','600 9px Inter','right',1);
 well(c,20,48,278,322,10,'#06070a');
 // the arrival rail: 0 to 10 ms
 const rx=118,rw=164;for(let ms=0;ms<=10;ms+=2){const x=rx+ms/10*rw;c.fillStyle='rgba(255,255,255,.12)';c.fillRect(x,64,1,292);txt(c,ms+'',x,354+8,'#5f6670','700 8px DejaVu Sans Mono','center')}
 txt(c,'ms after the lead',282,62,'#5f6670','700 7.5px Inter','right');
 MIC.forEach(([n,col],i)=>{const y=88+i*38;const ms=[0,.2,2.6,4.1,5.3,9.8,5.3][i];
   // jack, label
   c.save();c.shadowColor='rgba(0,0,0,.9)';c.shadowBlur=6;const g=c.createRadialGradient(36,y-2,1,38,y,10);g.addColorStop(0,'#e9ecf0');g.addColorStop(1,'#4d5259');c.fillStyle=g;c.beginPath();c.arc(38,y,9,0,7);c.fill();c.restore();c.fillStyle='#050505';c.beginPath();c.arc(38,y,4,0,7);c.fill();
   c.strokeStyle=col;c.lineWidth=1.5;c.beginPath();c.arc(38,y,11.5,0,7);c.stroke();bloom(c,38,y,18,col,.25);
   txt(c,n,54,y-3,'#f2efe8','700 10.5px Inter');txt(c,i?'+'+ms.toFixed(1)+' ms':'LEAD',54,y+10,i?'#9aa0a8':'#ffb23e','700 8.5px DejaVu Sans Mono');
   // a straight patch cable from the jack to its arrival point, with a plug
   const px=rx+ms/10*rw;c.save();c.strokeStyle=col;c.lineWidth=3.2;c.lineCap='round';c.shadowColor=col;c.shadowBlur=8;c.globalAlpha=.9;c.beginPath();c.moveTo(48,y);c.lineTo(px-8,y);c.stroke();c.restore();
   c.save();c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=1;c.beginPath();c.moveTo(48,y-1);c.lineTo(px-8,y-1);c.stroke();c.restore();
   metal(c,px-9,y-5,14,10,3,'#f1f3f6','#8a9098',false);c.save();c.fillStyle=col;c.shadowColor=col;c.shadowBlur=10;c.fillRect(px+4,y-2,4,4);c.restore()});
 // clean-up and bleed
 txt(c,'CLEAN-UP',26,396,'#b9bec6','800 9px Inter','left',2);glowTxt(c,'18 dB',292,396,'#7cff9b','700 11px DejaVu Sans Mono','right');
 well(c,26,406,266,12,6);const g2=c.createLinearGradient(26,0,190,0);g2.addColorStop(0,'rgba(124,255,155,0)');g2.addColorStop(1,'#7cff9b');c.save();c.fillStyle=g2;c.shadowColor='#7cff9b';c.shadowBlur=10;rr(c,28,409,160,6,3);c.fill();c.restore();metal(c,180,400,22,24,5,'#f1f3f6','#8a9098',false);
 toggle(c,50,462,true,'DRUM');toggle(c,104,462,false,'KIT');toggle(c,158,462,true,'BLEED');led(c,68,452,'#2ee6ff',true);led(c,176,452,'#7cff9b',true);
 knob(c,252,462,20,'#2ee6ff',.4);txt(c,'BLEED',252,500,'#b9bec6','800 8px Inter','center',1.2);
 // AUTO PREP: the big one
 c.save();c.shadowColor='#2ee6ff';c.shadowBlur=26;const bg=c.createRadialGradient(159,560,4,159,560,90);bg.addColorStop(0,'#8ff4ff');bg.addColorStop(1,'#0b5466');c.fillStyle=bg;rr(c,26,526,266,70,14);c.fill();c.restore();c.save();rr(c,26.5,526.5,265,69,14);c.strokeStyle='rgba(255,255,255,.55)';c.stroke();c.restore();
 txt(c,'AUTO PREP',159,566,'#fff','900 16px Inter','center',5);txt(c,'find · align · tune · mix · level, in one go',159,584,'#d9fbff','600 9px Inter','center');
 well(c,20,612,278,86,10);txt(c,'Snare 1 · Maple 14×6.5',36,640,'#f2efe8','700 12px Inter');txt(c,'Limitless Snares · Center · 6 × 6',36,658,'#9aa0a8','500 10.5px Inter');
 [['FOUND','#ff3da8'],['ALIGNED','#9b6bff'],['TUNED','#c6ff6b'],['LEVELLED','#7cff9b']].forEach(([s,col],k)=>{led(c,40+k*66,682,col,true);txt(c,s,48+k*66,685,col,'800 7px Inter','left',.6)});}

// 2 ALIGN — pick the mic, pick what it lines up to; Hitline's scope
{const c=panel(1,'ALIGN','pick the mic, pick what it lines up to','#9b6bff');
 c.fillStyle='#050608';c.fillRect(0,0,W,H);metal(c,4,6,W-8,H-12,12,'#1f1b29','#0d0b12');screws(c,4,6,W-8,H-12);
 glowTxt(c,'ALIGN',26,34,'#9b6bff','800 11px Inter','left',3);txt(c,'SNAP TO ALL: A',292,34,'#8b9099','600 9px Inter','right',1);
 dropdown(c,24,58,132,'MIC','Overheads','#9b6bff');dropdown(c,164,58,130,'LINES UP TO','Top (lead)','#2ee6ff');
 // the scope: reference as a grey silhouette, the mic as a heat-coloured line
 well(c,20,96,278,168,12,'#07050c');for(let y=100;y<262;y+=3){c.fillStyle='rgba(155,107,255,.025)';c.fillRect(22,y,274,1)}
 const n=AR.TOP.length,sx=26,sw=266,cy=180,amp=66;
 c.save();c.beginPath();c.moveTo(sx,cy);for(let k=0;k<n;k++){const x=sx+k/n*sw*1.6;if(x>sx+sw)break;c.lineTo(x,cy-AR.TOP[k]*amp)}c.lineTo(sx+sw,cy);c.closePath();c.fillStyle='rgba(200,205,215,.13)';c.fill();c.restore();
 for(let k=1;k<n;k++){const x0=sx+(k-1-6)/n*sw*1.6,x1=sx+(k-6)/n*sw*1.6;if(x0<sx||x1>sx+sw)continue;const heat=Math.min(1,k/n*2.2);const col=`hsl(${230-heat*200},95%,${55+heat*10}%)`;c.save();c.strokeStyle=col;c.lineWidth=2.2;c.shadowColor=col;c.shadowBlur=10;c.beginPath();c.moveTo(x0,cy-AR.OH[k-1]*amp);c.lineTo(x1,cy-AR.OH[k]*amp);c.stroke();c.restore()}
 const lx=sx+64/n*sw*1.6;c.strokeStyle='#ff4d5e';c.beginPath();c.moveTo(lx,102);c.lineTo(lx,258);c.stroke();c.save();c.setLineDash([3,3]);c.strokeStyle='#7cff9b';c.beginPath();c.moveTo(lx+2,102);c.lineTo(lx+2,258);c.stroke();c.restore();
 txt(c,'DRAG TO MOVE',290,254,'#6a5f80','800 7.5px Inter','right',1.2);txt(c,'blue fights · red locks',30,254,'#6a5f80','700 7.5px Inter');
 // delay with nudges
 glowTxt(c,'+2.6 ms',26,294,'#f2efe8','700 18px DejaVu Sans Mono');txt(c,'115 SAMPLES',26,308,'#8b9099','700 8px DejaVu Sans Mono');nudge(c,160,276,'#9b6bff');
 // score: a compact heat bar, before → now
 txt(c,'SUM SCORE',26,328,'#b9bec6','800 8.5px Inter','left',1.8);glowTxt(c,'0.41 → 0.88',292,326,'#ffd85a','700 11px DejaVu Sans Mono','right');
 const bx=26,bw=266;for(let k=0;k<54;k++){const col=`hsl(${225-k*4},92%,58%)`;c.save();c.fillStyle=col;c.globalAlpha=k<47?1:.15;if(k<47){c.shadowColor=col;c.shadowBlur=6}rr(c,bx+k*4.93,334,3.6,14,1.5);c.fill();c.restore()}
 c.fillStyle='#fff';c.fillRect(bx+bw*.41,330,2,22);txt(c,'AS RECORDED',bx+bw*.41,362,'#8b9099','800 7px Inter','center',.8);
 // polarity, phase EQ, L/R lock, pull, group
 hwbtn(c,24,378,84,30,'Ø NATURAL','#7cff9b',true);hwbtn(c,116,378,86,30,'PHASE EQ','#9b6bff',true);hwbtn(c,210,378,84,30,'L/R LOCK','#9b6bff',true);
 txt(c,'190 · 410 Hz all-pass',159,424,'#c9b8ff','700 8px DejaVu Sans Mono','center');
 knob(c,62,470,20,'#ffb23e',1);txt(c,'PULL',62,506,'#b9bec6','800 8px Inter','center',1.2);glowTxt(c,'100 %',62,520,'#ffb23e','700 9.5px DejaVu Sans Mono','center');
 hwbtn(c,110,452,88,30,'AS RECORDED','#2ee6ff',false);hwbtn(c,206,452,88,30,'AUTO-ALIGN','#9b6bff',true);hwbtn(c,110,490,184,28,'GROUP: ROOMS TO ROOM CLOSE','#ff3da8',false);
 well(c,20,532,278,112,10);txt(c,'SUM BY FREQUENCY',30,550,'#6a707a','800 8px Inter','left',1.2);
 for(let b=0;b<30;b++){const v=.4+.55*Math.exp(-((b-8)**2)/40)+.1*Math.sin(b);const bh=v*72;const col=`hsl(${220-v*180},90%,60%)`;c.save();c.fillStyle=col;c.shadowColor=col;c.shadowBlur=6;c.fillRect(30+b*8.7,636-bh,6,bh);c.restore()}
 hwbtn(c,24,656,130,30,'MONO TEST','#7cff9b',false,playIcon(c,'#7cff9b'));led(c,186,671,'#7cff9b',true);txt(c,'IN PHASE · +0.82',196,674,'#7cff9b','800 8px Inter','left',1);}

// 3 TUNE — strobe, the pitch map and Hitline's numbers
{const c=panel(2,'TUNE','a strobe tuner, the pitch map and the numbers','#c6ff6b');
 c.fillStyle='#050608';c.fillRect(0,0,W,H);metal(c,4,6,W-8,H-12,12,'#141615','#070807');screws(c,4,6,W-8,H-12);
 glowTxt(c,'TUNE',26,34,'#c6ff6b','800 11px Inter','left',3);
 dropdown(c,164,46,130,'','Top mic','#c6ff6b');
 // compact strobe + nixie
 well(c,20,82,132,132,66,'#050605');const cx=86,cy=148;
 for(let ring=0;ring<3;ring++){const R=58-ring*13,n=20+ring*8;for(let k=0;k<n;k++){const a=k/n*2*Math.PI+ring*.2;c.save();c.fillStyle='#c6ff6b';c.globalAlpha=.75-ring*.15;c.shadowColor='#c6ff6b';c.shadowBlur=6;c.translate(cx,cy);c.rotate(a);c.fillRect(R-8,-2,8,4);c.restore()}}
 metal(c,cx-26,cy-16,52,32,6,'#151715','#060706',false);c.save();c.font='700 20px DejaVu Sans Mono';c.fillStyle='#ffb04a';c.shadowColor='#ff8a1e';c.shadowBlur=14;c.textAlign='center';c.fillText('A#3',cx,cy+7);c.restore();
 // the numbers, Hitline's
 const rows=[['RECORDED','A#3 −12 ¢'],['TARGET','A#3 · nearest'],['FREQUENCY','231.4 Hz'],['RATIO','1.0069'],['RR SPREAD','14 ¢'],['WORST','V1 · 22 ¢']];
 well(c,160,82,138,132,10,'#060706');rows.forEach(([k,v],i)=>{txt(c,k,170,102+i*20,'#6a7a5a','800 7.5px Inter','left',1);txt(c,v,290,102+i*20,i==5?'#ffb04a':'#e9ffd0','700 9.5px DejaVu Sans Mono','right')});
 // cents needle
 well(c,20,222,278,46,8);for(let k=-5;k<=5;k++){const x=159+k*24;c.fillStyle=k?'rgba(255,255,255,.3)':'#c6ff6b';c.fillRect(x,228,k?1:2,k%5?6:12)}
 c.save();c.strokeStyle='#ff6a3d';c.lineWidth=2;c.shadowColor='#ff6a3d';c.shadowBlur=10;c.beginPath();c.moveTo(130,228);c.lineTo(134,262);c.stroke();c.restore();glowTxt(c,'−12 ¢',159,262,'#c6ff6b','700 10px DejaVu Sans Mono','center');
 // the pitch map: every hit, by velocity
 well(c,20,278,278,180,10,'#050605');txt(c,'PITCH MAP · EVERY HIT',30,296,'#6a7a5a','800 8px Inter','left',1.2);
